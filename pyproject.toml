[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner3d"
version = "2.0.0"
description = "Scanner 3D pour Intel RealSense D435i : capture guidée, reconstruction 3D en direct, modèle PLY/STL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "open3d>=0.18",
    "pyrealsense2>=2.54",
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
scanner3d = "scanner3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scanner3d = ["presets/*.json"]

[tool.ruff]
line-length = 120
src = ["src", "."]
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/scanner3d/gui/*.py" = ["N802"]  # noms imposés par Qt (paintEvent, sizeHint...)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["gpu: reconstruction complète avec Open3D (CPU ou CUDA), quelques secondes"]
